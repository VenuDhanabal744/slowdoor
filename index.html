<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slowdoor</title>
<meta name="theme-color" content="#14161f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="gate" hidden>
  <p class="eyebrow" id="g-count"></p>
  <h1 id="g-title"></h1>
  <div class="ring" id="g-ring" role="timer" aria-label="Seconds left"><span id="g-secs"></span></div>
  <label for="g-why">What are you opening this for?</label>
  <input id="g-why" type="text" autocomplete="off" maxlength="120" placeholder="e.g. reply to a message">
  <button id="g-back" class="btn primary" type="button">Never mind</button>
  <button id="g-open" class="btn quiet" type="button" disabled>Open anyway</button>
  <p class="hint" id="g-hint" aria-live="polite"></p>
</main>

<main id="done" hidden>
  <h1>Good call.</h1>
  <p class="hint">Swipe up and get on with your day.</p>
</main>

<main id="home" hidden>
  <h1>Slowdoor</h1>

  <section class="card center">
    <h2>Focus score today</h2>
    <p class="big" id="h-score"></p>
    <p class="hint" id="h-streak"></p>
  </section>

  <section class="card">
    <h2>Today</h2>
    <ul id="h-apps"></ul>
  </section>

  <section class="card">
    <h2>Gate visits, last 7 days</h2>
    <p class="legend">
      <span><i class="sw pass"></i>Opened anyway</span>
      <span><i class="sw back"></i>Walked away</span>
    </p>
    <div class="chart" id="h-chart"></div>
    <p class="hint" id="h-day" aria-live="polite"></p>
  </section>
</main>

<noscript><main><p>Slowdoor needs JavaScript.</p></main></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
